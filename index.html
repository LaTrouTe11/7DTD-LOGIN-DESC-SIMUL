<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBC MATRIX — 7DTD COCKPIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENTÊTE DE SÉLECTION DU COCKPIT -->
    <div class="matrix-header">
        <div class="header-logo">⚙️ QBC MATRIX — CONTROL PANEL</div>
        
        <div class="global-controls">
            <!-- VARIATEUR DE ZOOM SÉCURISÉ -->
            <div class="control-group">
                <label for="uiZoomSelect" style="color: #fbbf24; font-weight: bold;">Taille Écran :</label>
                <select id="uiZoomSelect" class="matrix-select" onchange="window.changeUiZoom(this.value)">
                    <option value="60">60 % (Ultra Compact)</option>
                    <option value="70">70 % (Très Serré)</option>
                    <option value="80" selected>80 % (Standard QBC)</option>
                    <option value="90">90 % (Grand Écran)</option>
                    <option value="100">100 % (Plein Format)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="serverSelect" style="color: #34d399; font-weight: bold;">Serveur Actif :</label>
                <select id="serverSelect" class="matrix-select"></select>
                <button type="button" class="matrix-action-btn" onclick="window.editCurrentServerName()">✏️ RENOMMER</button>
                <button type="button" class="matrix-action-btn" style="background:#0284c7; border-color:#38bdf8;" onclick="window.createNewServerInstance()">➕ NOUVEAU</button>
            </div>
        </div>
    </div>

    <!-- COMMUTATEURS D'ONGLETS SÉCURISÉS -->
    <div class="matrix-tabs-container">
        <button type="button" id="tab-login-btn" class="tab-btn active" onclick="window.switchTab('login')">🔒 MESSAGE ACCUEIL (MOTD)</button>
        <button type="button" id="tab-desc-btn" class="tab-btn" onclick="window.switchTab('desc')">🌐 DESCRIPTION WEB (SERVER LIST)</button>
    </div>

    <div class="matrix-workspace-wrapper">
        <!-- FORMULAIRE ACCUEIL (LOGIN) -->
        <div id="content-login" class="tab-content active">
            <div class="workspace-panel-title">
                <span>📝 GRILLE DES MESSAGES DE LOGIN</span>
                <div style="display:flex; gap:15px; align-items:center;">
                    <label style="font-size:11px; color:#38bdf8; font-weight:bold; cursor:pointer;">
                        <input type="checkbox" id="loginEnglishToggle" onchange="window.toggleLoginEnglish(this.checked)"> Activer Traduction EN (Globale)
                    </label>
                    <button type="button" class="add-row-btn" onclick="window.addNewLine()">➕ AJOUTER UNE LIGNE</button>
                </div>
            </div>
            <div id="linesContainer" class="lines-matrix-holder"></div>
        </div>

        <!-- FORMULAIRE DESCRIPTION WEB (DESC) -->
        <div id="content-desc" class="tab-content">
            <div class="workspace-panel-title">
                <span>📝 GRILLE DES MESSAGES DE DESCRIPTION LISTE</span>
                <div style="display:flex; gap:15px; align-items:center;">
                    <label style="font-size:11px; color:#38bdf8; font-weight:bold; cursor:pointer;">
                        <input type="checkbox" id="descEnglishToggle" onchange="window.toggleDescEnglish(this.checked)"> Activer Traduction EN (Globale)
                    </label>
                    <button type="button" class="add-row-btn" onclick="window.addNewDescLine()">➕ AJOUTER UNE LIGNE</button>
                </div>
            </div>
            <div id="descLinesContainer" class="lines-matrix-holder"></div>
        </div>
    </div>
    <!-- ZONE INFÉRIEURE : APERÇU JEU ET PAYLOAD TEXTMESHPRO -->
    <div class="matrix-output-section">
        <!-- COCKPIT APERÇU REÉL JEU (BOX NOIRE) -->
        <div class="output-panel">
            <div class="panel-header">📺 RENDU GRAPHIQUE IN-GAME (CONFORME JEU)</div>
            <div id="preview" class="game-preview-screen"></div>
        </div>

        <!-- ZONE DE CODE FINAL PRÊT À COPIER (BOX NOIRE PAYLOAD) -->
        <div class="output-panel">
            <div class="panel-header">
                <span>📋 CODE CONFIG PAYLOAD (TEXTMESHPRO)</span>
                <button type="button" class="copy-payload-btn" onclick="window.copyMasterPayload()">📋 COPIER TOUT LE CODE</button>
            </div>
            <textarea id="masterOutput" class="raw-payload-box" readonly placeholder="Le code TextMeshPro final se génère ici au fur et à mesure..."></textarea>
        </div>
    </div>

    <!-- PANNEAU DE PILOTAGE DE LA BASE DE DONNÉES JSON -->
    <div class="matrix-footer-actions">
        <div id="qbcTimeTrackerText" class="tracker-status-label">💾 ARCHITECTURE CENTRALISÉE — MOTEUR SOUDÉ ET OPÉRATIONNEL !</div>
        
        <div class="archive-action-group">
            <input type="file" id="jsonFileInput" style="display: none;" onchange="window.importQbcConfig(event)">
            <button type="button" class="footer-btn btn-blue" onclick="window.triggerJsonImport()">📥 IMPORTER ARCHIVE JSON</button>
            <button type="button" class="footer-btn btn-green" onclick="window.exportQbcConfig()">💾 EXPORTER SAUVEGARDE JSON</button>
        </div>
    </div>

    <!-- APPEL UNIQUE DU FICHIER CENTRALISÉ SANS CONFLIT DE COCHAGE -->
    <script src="script.js"></script>

</body>
</html>
